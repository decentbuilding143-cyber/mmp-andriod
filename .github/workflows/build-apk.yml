name: Build MMP APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Extract MMP project
        run: |
          mkdir extracted
          ARCHIVE="./mmp-android-cloud-build-1-fixed.zip"
          echo "Using archive: $ARCHIVE"
          unzip -q "$ARCHIVE" -d extracted
          find extracted -maxdepth 3 -type f | head -50

      - name: Build APK
        working-directory: extracted/mmp_work
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=ignore" >> gradle.properties
          gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          cp extracted/mmp_work/app/build/outputs/apk/debug/app-debug.apk MMP-v1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MMP-APK
          path: MMP-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 14
